[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlab"
version = "0.1.0"
description = "Market-implied credit risk analysis from corporate bond spreads"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "requests",
    "python-dotenv",
    "matplotlib",
    "statsmodels",
    "pytest"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]